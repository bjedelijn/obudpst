name: Publish modern UDPST Beta 1
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH-BETA-1 to confirm prerelease publication'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-modern-v9.1.0-beta.1
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH-BETA-1' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned Beta 1 source
        uses: actions/checkout@v4
        with:
          ref: 41ac2cda31382c3e7b0c4bb3549e4d7e490d6b7e
          persist-credentials: false
      - name: Verify source and release availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "41ac2cda31382c3e7b0c4bb3549e4d7e490d6b7e"
          if gh release view modern-v9.1.0-beta.1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/modern-v9.1.0-beta.1 | grep -q .; then
            echo 'Tag already exists; refusing to overwrite' >&2
            exit 1
          fi
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          test -x build/udpst
      - name: Run scoped regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_baseline.py' -v
          python3 -m unittest discover -s tests -p 'test_port_range_source.py' -v
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp build/udpst README.md RELEASING.md BETA1-VALIDATION.md dist/package/
          printf 'tag=modern-v9.1.0-beta.1\ncommit=%s\n' "$(git rev-parse HEAD)" > dist/package/BUILD-INFO.txt
          tar -czf dist/udpst-modern-v9.1.0-beta.1-linux-amd64.tar.gz -C dist/package .
          (cd dist && sha256sum udpst-modern-v9.1.0-beta.1-linux-amd64.tar.gz > SHA256SUMS)
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create modern-v9.1.0-beta.1 \
            dist/udpst-modern-v9.1.0-beta.1-linux-amd64.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Modern UDPST 9.1.0 Beta 1" \
            --notes-file BETA1-VALIDATION.md \
            --prerelease
