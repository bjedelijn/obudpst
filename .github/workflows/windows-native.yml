name: Windows native port - diagnostic build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-native
      - fix/windows-native-timer-parity
    paths:
      - '.github/workflows/windows-native.yml'
      - 'CMakeLists.txt'
      - '*.c'
      - '*.h'
      - 'docs/windows-native-port.md'
      - 'platform/win32/**'

jobs:
  windows-x64-diagnostic:
    name: Windows x64 sending-rate compile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (diagnostic)
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 *> configure.log
          $status = $LASTEXITCODE
          Get-Content configure.log
          exit $status
      - name: Build Windows sending-rate module
        shell: pwsh
        run: |
          cmake --build build-windows --config Release *> build.log
          $status = $LASTEXITCODE
          Get-Content build.log
          exit $status
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build-logs
          path: |
            configure.log
            build.log
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-windows/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  win32-control-data-diagnostic:
    name: Windows x64 control/data compilation (strict)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        run: cmake -S . -B build-port-diagnostics -A x64
      - name: Compile original control/data modules (strict)
        shell: pwsh
        run: |
          cmake --build build-port-diagnostics --config Release --target udpst_win32_port_diagnostics *> port-errors.log
          $status = $LASTEXITCODE
          Get-Content port-errors.log
          exit $status
      - name: Upload MSVC portability errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-control-data-port-errors
          path: port-errors.log
          if-no-files-found: ignore

  win32-main-port-diagnostic:
    name: Windows x64 main module compilation (strict)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        run: cmake -S . -B build-main-diagnostics -A x64
      - name: Compile Windows main module (strict)
        shell: pwsh
        run: |
          cmake --build build-main-diagnostics --config Release --target udpst_win32_main_diagnostics *> main-errors.log
          $status = $LASTEXITCODE
          Get-Content main-errors.log
          exit $status
      - name: Upload main module MSVC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-main-port-errors
          path: main-errors.log
          if-no-files-found: ignore

  win32-full-link-probe:
    name: Windows x64 executable build and smoke test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S . -B build-link-probe -A x64
      - name: Build full Windows executable (strict)
        shell: pwsh
        run: |
          cmake --build build-link-probe --config Release --target udpst_win32_link_probe *> link-errors.log
          $status = $LASTEXITCODE
          Get-Content link-errors.log
          exit $status
      - name: Stage portable Windows runtime
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "windows-package"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "build-link-probe/Release/udpst.exe" $stage
          $crypto = Get-ChildItem "C:/Program Files/OpenSSL", "C:/Program Files", "C:/hostedtoolcache/windows" -Filter "libcrypto-3-x64.dll" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $crypto) {
            throw "Required OpenSSL runtime libcrypto-3-x64.dll not found; refusing incomplete package"
          }
          Copy-Item $crypto.FullName $stage
          Write-Host "Bundled OpenSSL runtime from $($crypto.FullName)"
          Get-ChildItem $stage | Select-Object Name, Length
      - name: Smoke test Windows executable
        shell: pwsh
        timeout-minutes: 2
        run: |
          $exe = Join-Path $PWD "windows-package/udpst.exe"
          if (-not (Test-Path $exe)) { throw "udpst.exe missing after successful build" }
          # -h without its required argument prints usage and exits immediately.
          # Use a bounded child process so a regression cannot hang CI.
          $stdout = Join-Path $PWD "smoke-help-stdout.log"
          $stderr = Join-Path $PWD "smoke-help-stderr.log"
          $proc = Start-Process -FilePath $exe -ArgumentList "-h" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $proc.WaitForExit(10000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "udpst.exe usage smoke test timed out after 10 seconds"
          }
          $status = $proc.ExitCode
          Get-Content $stdout
          Get-Content $stderr
          if ($status -ne 50) { throw "Unexpected udpst.exe -h exit code $status (expected 50)" }
          if (-not ((Get-Content $stdout, $stderr) -match "Parameters:")) {
            throw "udpst.exe -h did not print expected usage text"
          }
          Write-Host "Windows executable startup smoke test passed"
      - name: Verify timer diagnostics in packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "windows-package/udpst.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $binaryText = [System.Text.Encoding]::GetEncoding(28591).GetString($bytes)
          if (-not $binaryText.Contains("UDPST-TIMER-SLOTS")) {
            throw "Packaged udpst.exe does not contain UDPST-TIMER-SLOTS diagnostics"
          }
          Write-Host "Timer diagnostics verified in packaged udpst.exe"
      - name: Upload native Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: udpst-windows-x64
          path: windows-package/
          if-no-files-found: error
      - name: Upload linker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-executable-link-errors
          path: link-errors.log
          if-no-files-found: ignore

  win32-platform-smoke:
    name: Windows x64 platform primitives
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure portability tests
        run: cmake -S platform/win32/tests -B build-platform -A x64
      - name: Build portability tests
        run: cmake --build build-platform --config Release
      - name: Run portability tests
        run: ctest --test-dir build-platform -C Release --output-on-failure
