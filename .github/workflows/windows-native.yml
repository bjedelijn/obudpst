name: Windows native port - diagnostic build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-native
    paths:
      - '.github/workflows/windows-native.yml'
      - 'CMakeLists.txt'
      - '*.c'
      - '*.h'
      - 'docs/windows-native-port.md'
      - 'platform/win32/**'

jobs:
  windows-x64-diagnostic:
    name: Windows x64 sending-rate compile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (diagnostic)
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 *> configure.log
          $status = $LASTEXITCODE
          Get-Content configure.log
          exit $status
      - name: Build Windows sending-rate module
        shell: pwsh
        run: |
          cmake --build build-windows --config Release *> build.log
          $status = $LASTEXITCODE
          Get-Content build.log
          exit $status
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build-logs
          path: |
            configure.log
            build.log
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-windows/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  win32-platform-smoke:
    name: Windows x64 platform primitives
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure portability tests
        run: cmake -S platform/win32/tests -B build-platform -A x64
      - name: Build portability tests
        run: cmake --build build-platform --config Release
      - name: Run portability tests
        run: ctest --test-dir build-platform -C Release --output-on-failure
